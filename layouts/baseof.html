<!DOCTYPE html>
<html lang="{{ with site.Language.Locale }}{{ . }}{{ else }}en{{ end }}">
  {{- partial "head.html" . -}}
  {{/* data-page: tên section ("home", "blog", "products"...) để CSS/test nhận biết trang. */}}
  <body data-page="{{ .Section | default "home" }}">
    {{- partial "preloader.html" . -}}
    {{- partial "header.html" . -}}
    {{- block "main" . }}{{- end }}
    {{- partial "footer.html" . -}}
  </body>
</html>
