<section class="sk-section" id="gifting" aria-labelledby="gifting-heading">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-5 mb-4 mb-lg-0">
        <h2 id="gifting-heading">{{ or (i18n "sk_gifting_title") "Gửi Tặng Kit Cho Người Thương" }}</h2>
        <p>{{ or (i18n "sk_gifting_help") "Gửi kèm thiệp nhắn gửi động viên cho bạn thân, người yêu, secret crush hoặc cả nhóm đồ án đang chiến deadline." }}</p>
      </div>
      <div class="col-lg-6 offset-lg-1">
        <form class="sk-form js-gifting-form" action="{{ "send-rescue/" | relLangURL }}" method="get">
          <div class="sk-field">
            <label class="sk-label" for="recipient">{{ or (i18n "sk_recipient") "Người nhận (tên hoặc biệt danh)" }}</label>
            <input class="sk-input js-gift-recipient" id="recipient" name="recipient" type="text" required autocomplete="name" maxlength="60" placeholder="Ví dụ: Minh Anh, Hoàng Nam...">
          </div>
          <div class="sk-field">
            <label class="sk-label" for="gift-type">{{ or (i18n "sk_gift_type") "Kiểu Rescue tiếp sức" }}</label>
            <select class="sk-input js-gift-type" id="gift-type" name="type" required>
              <option value="bestie">Bestie Rescue (Bạn thân)</option>
              <option value="love">Love Rescue (Người yêu)</option>
              <option value="crush">Secret Crush Rescue (Crush giấu tên)</option>
              <option value="team">Team Rescue (Đồng đội đồ án / CLB)</option>
            </select>
          </div>
          <div class="sk-field">
            <label class="sk-label" for="gift-message">{{ or (i18n "sk_gift_note") "Lời nhắn trên thiệp" }}</label>
            <textarea class="sk-input js-gift-message" id="gift-message" name="message" rows="3" maxlength="200" placeholder="Nhập lời chúc hoặc lời nhắn động viên..."></textarea>
          </div>
          <button type="submit" class="sk-btn sk-btn-secondary sk-focusable">
            {{ or (i18n "sk_gifting_submit") "Tiếp tục gửi" }} <i class="ti-arrow-right ml-1" aria-hidden="true"></i>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
