<section class="sk-section" id="schedule" aria-labelledby="schedule-heading">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-5 mb-4 mb-lg-0">
        <h2 id="schedule-heading">{{ or (i18n "sk_schedule_title") "Lên Lịch Tiếp Sức Trước Deadline" }}</h2>
        <p>{{ or (i18n "sk_schedule_help") "Chọn hạn chót, sau đó chọn ngày nhận trước deadline 1–2 ngày để Survival Kit kịp thời tiếp viện năng lượng." }}</p>
      </div>
      <div class="col-lg-6 offset-lg-1">
        <form class="sk-form js-schedule-form" action="{{ "schedule-rescue/" | relLangURL }}" method="get">
          <div class="sk-field">
            <label class="sk-label" for="deadline">{{ or (i18n "sk_deadline") "Ngày hạn chót (Deadline)" }}</label>
            <input class="sk-input js-deadline" id="deadline" name="deadline" type="date" required>
          </div>
          <div class="sk-field">
            <label class="sk-label" for="receive">{{ or (i18n "sk_receive") "Ngày bạn muốn nhận kit" }}</label>
            <input class="sk-input js-receive" id="receive" name="receive" type="date" required>
          </div>
          <button type="submit" class="sk-btn sk-btn-primary sk-focusable">
            {{ or (i18n "sk_schedule_submit") "Tiếp tục đặt lịch" }} <i class="ti-arrow-right ml-1" aria-hidden="true"></i>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
