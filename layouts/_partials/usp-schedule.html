<section class="sk-section" id="schedule" aria-labelledby="schedule-heading">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-5 mb-4 mb-lg-0">
        <h2 id="schedule-heading">{{ or (i18n "sk_schedule_title") "Schedule Your Rescue" }}</h2>
        <p>{{ or (i18n "sk_schedule_help") "Pick the deadline, then a receive day 1–2 days earlier. Demo only — nothing is stored." }}</p>
      </div>
      <div class="col-lg-6 offset-lg-1">
        <form class="sk-form js-schedule-form" action="{{ site.Params.contact.formAction }}" method="post" novalidate>
          <div class="sk-field">
            <label class="sk-label" for="deadline">{{ or (i18n "sk_deadline") "Deadline date" }}</label>
            <input class="sk-input js-deadline" id="deadline" name="deadline" type="date" required>
          </div>
          <div class="sk-field">
            <label class="sk-label" for="receive">{{ or (i18n "sk_receive") "Receive date" }}</label>
            <input class="sk-input js-receive" id="receive" name="receive" type="date" required>
          </div>
          <button type="submit" class="sk-btn sk-btn-primary sk-focusable">{{ or (i18n "sk_schedule_submit") "Lock in rescue" }}</button>
          <p class="js-schedule-status mt-3 mb-0" role="status"></p>
        </form>
      </div>
    </div>
  </div>
</section>
