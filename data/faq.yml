faqItem:
  - title: Tôi có thể đổi lịch giao kit cứu trợ không?
    content: Có, bạn có thể đổi ngày hoặc khung giờ nhận kit hoàn toàn miễn phí trước thời điểm giao dự kiến ít nhất 24 giờ. Bạn có thể bấm nút "Đổi lịch" trên trang xác nhận / giỏ hàng hoặc liên hệ trực tiếp với đội ngũ tiếp sức.

  - title: Phí giao hàng và khu vực áp dụng như thế nào?
    content: Dịch vụ tiếp sức của Survival Kit hiện hỗ trợ giao tận tay trong khu vực TP. Hồ Chí Minh (ưu tiên các trường Đại học, Ký túc xá ĐHQG, Bách Khoa, KHTN...). Trong giai đoạn demo thử nghiệm, toàn bộ đơn hàng đều được miễn phí giao hàng.

  - title: Nếu tôi bận thi lúc shipper tới thì xử lý thế nào?
    content: Shipper luôn gọi điện thoại trước khi giao. Nếu bạn đang trong phòng thi hoặc ca học, bạn có thể để lại ghi chú nhờ gửi tại phòng bảo vệ, bàn trực KTX, hoặc chúng mình sẽ hỗ trợ dời sang khung giờ kế tiếp trong ngày.

  - title: Tính năng gửi tặng ẩn danh (Secret Crush Rescue) hoạt động ra sao?
    content: Khi bạn chọn gửi ẩn danh, người nhận sẽ chỉ nhìn thấy trên thiệp dòng chữ "Từ một người bạn ẩn danh 💌". Thông tin tên và số điện thoại thật của bạn chỉ được lưu nội bộ cửa hàng để xác minh đơn hàng khi cần thiết và tuyệt đối không tiết lộ cho người nhận.

  - title: Chính sách an toàn thông điệp và chống quấy rối như thế nào?
    content: Survival Kit kiên quyết từ chối các thông điệp có nội dung xúc phạm, đe dọa, xúc phạm danh dự hoặc quấy rối người nhận. Người nhận quà có toàn quyền từ chối tiếp nhận kiện hàng hoặc liên hệ ban quản trị tại contact@survivalkit.vn để được hỗ trợ bảo vệ.
