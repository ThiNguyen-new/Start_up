######################## Câu chuyện trang chủ ##########################
# layouts/_partials/home-story.html — hiện ngay dưới hero, trước Panic Level.
# Nhịp 02 là bản nháp: nhóm thay bằng chuyện thật của mình nếu có.
# (Đã bỏ banner/about/cta/material/advantage/video/products: lorem ipsum của theme gốc, không trang nào dùng.)
story:
  enable : true
  eyebrow : "Vì sao có Survival Kit?"
  title : "2 giờ sáng. Deadline còn 7 tiếng. Trong phòng chỉ còn nửa gói mì."
  beats:
    - title : "Chuyện mùa nào cũng gặp"
      content : "Sinh viên không thiếu quyết tâm. Thứ thiếu là ly cà phê lúc 2 giờ sáng, cây bút dạ quang còn mực, và một người nói “ráng thêm chút nữa”. Lúc cần nhất lại là lúc không ai còn thời gian đi mua."
    - title : "Tụi mình cũng chạy deadline như bạn"
      content : "Survival Kit là đồ án của một nhóm sinh viên HCMUS. Tụi mình nhận ra vấn đề không phải là thiếu đồ, mà là thiếu đúng lúc: tới đêm cuối mới nhớ ra thì đã muộn."
    - title : "Nên tụi mình đóng gói sẵn sự tiếp sức"
      content : "Đồ uống, đồ ăn nhẹ, dụng cụ học và một lời nhắn, gom vào một chiếc hộp, chọn theo mức hoảng của bạn và tới trước deadline."
  paths:
    - problem : "Sát giờ mới nhớ ra chưa chuẩn bị gì."
      solution : "Đặt từ hôm nay, kit tới trước deadline 1–2 ngày."
      icon : "images/icons/schedule-rescue.svg"
      links:
        - label : "Schedule a Rescue"
          url : "schedule-rescue/"
    - problem : "Không biết mua gì, mỗi thứ một nơi."
      solution : "Kit phối sẵn theo Panic Level 1–7, hoặc tự phối từng món."
      icon : "images/icons/survival-kits.svg"
      links:
        - label : "Survival Kits"
          url : "products/"
        - label : "Build Your Own Kit"
          url : "build-your-own-kit/"
    - problem : "Muốn động viên bạn mà không biết nói sao."
      solution : "Gửi một chiếc hộp kèm thiệp viết tay hộ bạn."
      icon : "images/icons/send-rescue.svg"
      links:
        - label : "Send a Rescue"
          url : "send-rescue/"


########################## Testimonial ########################
testimonial:
  enable : true
  title : "Bình luận minh họa về Survival Kit"
  testimonialItem:
    # testimonial item loop
    - name : "Sinh viên năm 1"
      image : "images/clients/client-1.jpg" # size 100px*100px
      designation : "Nhận xét minh họa · Exam Survival Kit"
      content : "Mình hay rối khi nhìn cả đống bài cần làm. Checklist trong kit giúp mình chọn việc đầu tiên, còn tấm note động viên làm bàn học bớt căng thẳng."
      rating : "five" # rating star, one to five
      
    # testimonial item loop
    - name : "Sinh viên năm 2"
      image : "images/clients/client-2.jpg" # size 100px*100px
      designation : "Nhận xét minh họa · Mini Rescue Kit"
      content : "Mình thích ý tưởng chọn kit theo Panic Level. Trà, snack với giấy note là mấy món nhỏ nhưng hợp những buổi ngồi ôn bài dài."
      rating : "three" # rating star, one to five
      
    # testimonial item loop
    - name : "Thành viên nhóm đồ án"
      image : "images/clients/client-3.jpg" # size 100px*100px
      designation : "Nhận xét minh họa · Project Survival Kit"
      content : "Nhóm mình có thể dùng giấy note để gom ý tưởng rồi chia task rõ hơn. Bộ kit không làm bài thay mình, nhưng giúp buổi họp có thứ tự hơn."
      rating : "five" # rating star, one to five
      
    # testimonial item loop
    - name : "Bạn cùng lớp"
      image : "images/clients/client-4.jpg" # size 100px*100px
      designation : "Nhận xét minh họa · Burnout Care Kit"
      content : "Mình sẽ chọn hộp này làm quà sau kỳ thi. Tấm thiệp và lời nhắn khiến món quà giống một lời hỏi thăm, không phải lời nhắc phải cố thêm."
      rating : "four" # rating star, one to five
