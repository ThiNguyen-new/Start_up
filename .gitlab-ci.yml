stages:
  - build

variables:
  HUGO_ENV: production
  HUGO_VERSION: "0.163.3"
  GO_VERSION: "1.23.4"
  NODE_VERSION: "22.23.4"

cache:
  paths:
    - node_modules/
    - .pnpm-store/

default:
  image: node:${NODE_VERSION}
  before_script:
    - echo "USING NODE ${NODE_VERSION}"
    - apt-get update && apt-get install -y curl tar git
    - curl -LO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
    - tar -xvf hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
    - mv hugo /usr/local/bin/
    - rm -f hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
    - echo "HUGO ${HUGO_VERSION} INSTALLED"
    - curl -LO "https://dl.google.com/go/go${GO_VERSION}.linux-amd64.tar.gz"
    - tar -C /usr/local -xzf go${GO_VERSION}.linux-amd64.tar.gz
    - export PATH=$PATH:/usr/local/go/bin
    - rm -f go${GO_VERSION}.linux-amd64.tar.gz
    - echo "GO ${GO_VERSION} INSTALLED"
    - corepack enable
    - corepack prepare pnpm@12.15.0 --activate
    - pnpm install

pages:
  stage: build
  script:
    - pnpm run build
    - echo "SITE BUILT SUCCESSFULLY! LIVE AT https://$GITLAB_USER_LOGIN.gitlab.io/$CI_PROJECT_NAME/"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
